# Nginx Reverse Proxy & SSL Yapılandırması (Döviz Takip Uygulaması)
# /etc/nginx/sites-available/doviz-takip

# 1. HTTP -> HTTPS Otomatik Yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Buraya kendi domain veya VPS IP adresinizi yazınız

    # ACME Let's Encrypt SSL Doğrulama Yolu
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Güvenli HTTPS Sunucusu
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL Sertifikaları (Let's Encrypt Certbot tarafından üretilir)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # Modern SSL Güvenlik Parametreleri (A+ SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Güvenlik Başlıkları (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Sıkıştırma (Mobil veri tasarrufu ve ultra hızlı yükleme)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # PWA Service Worker & Manifest Önbellek Kuralı (Her zaman güncel kalsın)
    location ~* (service-worker\.js|manifest\.json)$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Python Multi-Threaded Sunucuya Ters Proxy (Reverse Proxy)
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        # İstemci Gerçek IP ve Protokol Başlıkları
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Zaman aşımı ayarları
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 50M; # Yedek geri yükleme zip dosyaları için
    }
}

